# ==========================================================
#  ATLAS — Stack completa (App + N8N + bancos)
#  Sobe tudo com: docker compose up -d
#  Antes, copie o arquivo .env.stack.example para .env e preencha.
# ==========================================================

services:

  # ---------- Banco de dados do ATLAS ----------
  atlas-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${ATLAS_DB_PASSWORD}
      POSTGRES_DB: atlas
    volumes:
      - atlas_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Aplicação ATLAS (app + backend) ----------
  atlas:
    build: .
    restart: unless-stopped
    depends_on:
      atlas-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://atlas:${ATLAS_DB_PASSWORD}@atlas-db:5432/atlas
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REGISTER_CODE: ${REGISTER_CODE}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      N8N_URL: http://atlas-n8n:5678
      N8N_KEY: ${N8N_KEY}
      PORT: 3000
    ports:
      - "3000:3000"

  # ---------- Banco de dados do N8N ----------
  atlas-n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- N8N (automações) ----------
  atlas-n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      atlas-n8n-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: atlas-n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_PUBLIC_API_DISABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"

volumes:
  atlas_db_data:
  n8n_db_data:
  n8n_data:
